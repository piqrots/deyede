name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy custom domain into build source
        run: |
          mkdir -p frontend/public
          cp index.html frontend/public/index.html
          cp favicon.png favicon.svg frontend/public/
          cp CNAME frontend/public/CNAME
          cp -R portofolio frontend/public/

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_GA_MEASUREMENT_ID: G-2XVRRYC6LS

      - name: Create static entries for React routes
        run: |
          for route in katalog portofolio cara-pesan tentang kontak; do
            mkdir -p "build/$route"
            cp build/index.html "build/$route/index.html"
          done
        working-directory: frontend

      - name: Add SPA route fallback
        run: cp build/index.html build/404.html
        working-directory: frontend

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4